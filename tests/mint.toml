# Local fake payments only. No Lightning node or real bitcoin is involved.
[info]
url = "http://127.0.0.1:33381"
listen_host = "127.0.0.1"
listen_port = 33381
mnemonic = "env:CASHU_ME_TEST_MINT_SEED"

[info.logging]
output = "stderr"
console_level = "error"

[database]
engine = "sqlite"

[mint_info]
name = "cashu.me test mint"
description = "Fake payments for local tests only"

[payment_backend]
backend = "fakewallet"
unit = "sat"

[fake_wallet]
fee_percent = 0.0
reserve_fee_min = 1
min_delay_time = 1
max_delay_time = 1
